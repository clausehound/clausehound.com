<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if env.preview %}<meta name="robots" content="noindex, nofollow">{% endif %}

<title>{% if title %}{{ title }} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ description | default: site.description }}">

<meta property="og:title" content="{{ title | default: site.title }}">
<meta property="og:description" content="{{ description | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:creator" content="{{ site.author }}">

<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<link rel="icon" href="/assets/paw.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon.png" sizes="32x32">
<meta name="theme-color" content="#14223A">
<link rel="stylesheet" href="/css/main.css">
