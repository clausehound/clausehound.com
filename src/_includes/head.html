<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if env.preview or noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}

{%- if title %}{% assign fullTitle = title | append: " | " | append: site.title %}{% else %}{% assign fullTitle = site.homeTitle %}{% endif %}
<title>{{ fullTitle }}</title>
<meta name="description" content="{{ description | default: site.description }}">

<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ fullTitle }}">
<meta property="og:description" content="{{ description | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:image" content="{{ site.url }}{{ site.image }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Clausehound: the legal knowledge engine for AI agents and legal teams">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:creator" content="{{ site.author }}">

<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<link rel="icon" href="/assets/paw.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon.png" sizes="32x32">
<meta name="theme-color" content="#14223A">
<link rel="stylesheet" href="/css/main.css">
{% include "schema.html" %}
